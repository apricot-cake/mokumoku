<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>操作デモ | mokumoku</title>
    <meta name="description" content="YouTubeチャンネル内で伸びている動画を比べるmokumokuの操作デモ。期間の選択と追加読み込みを試せます。">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./demo.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">mokumoku</a>
      <a href="https://github.com/apricot-cake/mokumoku">GitHub</a>
    </header>
    <main>
      <section class="introduction">
        <h1>動画の伸びを比べる</h1>
        <p>同じチャンネルの動画を、公開からの経過時間に応じた再生数の倍率で比べます。</p>
        <ol class="steps">
          <li>「さらに読み込む」で動画を追加</li>
          <li>「読み込み範囲」で期間を選択</li>
          <li>動画一覧と倍率を確認</li>
        </ol>
        <p class="sample-note">架空の動画を使ったデモです。YouTubeへの接続や動画の再生は行いません。</p>
        <button id="reset" type="button" class="reset">最初から試す</button>
      </section>
      <section class="panel" aria-label="サイドパネルの操作デモ">
        <header class="panel-header">
          <div class="channel-line">
            <h2>暮らしと道具の記録</h2>
            <p id="status" role="status"></p>
          </div>
          <div class="controls">
            <label for="period">読み込み範囲
              <select id="period">
                <option value="all">手動</option>
                <option value="week">直近1週間</option>
                <option value="month">直近1か月</option>
                <option value="quarter">直近3か月</option>
                <option value="halfYear">直近6か月</option>
                <option value="year">直近1年</option>
              </select>
            </label>
            <button id="load-more" type="button">さらに読み込む</button>
          </div>
        </header>
        <div class="panel-content">
          <!-- biome-ignore lint/a11y/noRedundantRoles: Safariでもlist-style:noneのリスト構造を保つ。 -->
          <ol id="videos" class="video-list" role="list"></ol>
          <p id="hidden-count" class="hidden-count" hidden></p>
          <section class="fresh-section">
            <h3>公開から1日未満（倍率は参考値）</h3>
            <!-- biome-ignore lint/a11y/noRedundantRoles: Safariでもlist-style:noneのリスト構造を保つ。 -->
            <ul id="fresh" class="video-list" role="list"></ul>
          </section>
        </div>
      </section>
    </main>
    <footer>
      <span>実際の利用にはChrome拡張機能が必要です。</span>
      <a href="https://github.com/apricot-cake/mokumoku#インストール">インストール手順</a>
      <a href="https://github.com/apricot-cake/mokumoku/blob/main/docs/使い方.md">使い方・計算方法</a>
    </footer>
    <noscript><p class="noscript">操作デモを表示するにはJavaScriptを有効にしてください。</p></noscript>
  </body>
</html>
